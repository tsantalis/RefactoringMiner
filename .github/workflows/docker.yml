name: Docker Build and Push

on:
  schedule:
    - cron: "0 0 * * 1" # Every Monday midnight
  workflow_dispatch:
    branches:
      - master
  repository_dispatch:
    types: [deploy]


jobs:
  push_to_docker_hub:
    if: github.repository == 'tsantalis/RefactoringMiner' # To ensure it doesn't get executed in the forks
    runs-on: ubuntu-latest
    steps:
        # Reuse the git objects cached by the Tests workflow on master, so that the checkout fetches only the objects changed since then
        - name: Restore git objects
          uses: actions/cache/restore@v4
          with:
            path: .git
            key: git-${{ runner.os }}-${{ github.sha }}
            restore-keys: git-${{ runner.os }}-

        - name: Checkout Repository
          uses: actions/checkout@v4
          with:
            persist-credentials: false

        - name: Setup QEMU
          uses: docker/setup-qemu-action@v1

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v1

        - name: Login to Docker Hub
          run: echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

        - name: Build and Push Docker Image
          run: docker buildx build --platform linux/amd64,linux/arm64 -f docker/Dockerfile -t tsantalis/refactoringminer:latest --push .
