# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Tests

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      actions: write

    env:
      OAuthToken: ${{ secrets.OAUTHTOKEN }} 

    steps:
    # Reuse the git objects of an earlier master build, so that the checkout fetches only the objects changed since then,
    # instead of the whole 3.5 GB tree of test resources. The checkout reuses a .git with the same remote.
    - name: Restore git objects
      uses: actions/cache/restore@v4
      with:
        path: .git
        key: git-${{ runner.os }}-${{ github.sha }}
        restore-keys: git-${{ runner.os }}-

    # The credentials are not kept in .git/config, so that the cached .git does not contain the token
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    # Drop the objects of the older snapshot, so that the cache does not grow with every build
    - name: Drop git objects of older snapshots
      if: github.ref == 'refs/heads/master'
      run: git reflog expire --expire=now --all && git repack -a -d -q

    - name: Save git objects
      if: github.ref == 'refs/heads/master'
      uses: actions/cache/save@v4
      with:
        path: .git
        key: git-${{ runner.os }}-${{ github.sha }}

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Configure Gradle for optimal use in GiHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3.5.0

    - name: Build with Gradle Wrapper
      run: |
        if [ "${{ github.event_name }}" == 'pull_request' ]; then
          ./gradlew build -x javadoc -Pnotoken
        else
          ./gradlew build -x javadoc
        fi

    - name: Archive Test Results
      uses: actions/upload-artifact@v4
      if: always()  # Ensures that this step runs even if the build fails
      with:
        name: test-results
        path: build/reports/tests/test

    - name: Publish Test Report
      uses: dorny/test-reporter@v1
      if: github.event_name != 'pull_request' && always()
      with:
        name: 'Unit Test Results'
        path: 'build/test-results/test/TEST-*.xml'
        reporter: 'java-junit'
        list-tests: failed
        fail-on-error: false
    
#    - name: Test Report to Gist
#      uses: gaelgirodon/ci-badges-action@v1
#      with:
#        gist-id: 19fb416d06d1b4d40820e0209540f6c0
#        token: ${{ secrets.GIST_TOKEN }}

  dispatch_deploy_event:
    if: github.repository == 'tsantalis/RefactoringMiner' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: dispatch docker build
        uses: peter-evans/repository-dispatch@v3
        with:
          event-type: deploy


